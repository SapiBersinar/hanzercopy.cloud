<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perancang Item & Artefak Legendaris - Hanzercopy</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- jsPDF and html2canvas for PDF export -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        /* Fallback font Inter for general text */
        body {
            font-family: 'Inter', sans-serif;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            overflow-x: hidden; /* Mencegah scroll horizontal */
        }
        /* Comic-like font for titles and specific elements */
        @import url('https://fonts.googleapis.com/css2?family=Comic+Neue:wght@700&family=Share+Tech+Mono&display=swap');
        .comic-font {
            font-family: 'Comic Neue', cursive;
        }
        /* Monospace font for AI generated content */
        .mono-font {
            font-family: 'Share Tech Mono', monospace; /* Font ala mesin tik/komputer */
        }
        /* Default font for inputs and general readability - ensure Inter */
        .default-font {
            font-family: 'Inter', sans-serif;
        }

        /* Gaya khusus untuk tombol komik */
        .comic-button {
            border: 4px solid black;
            box-shadow: 6px 6px 0px black;
            transition: all 0.2s ease-in-out;
        }
        .comic-button:hover {
            box-shadow: 2px 2px 0px black;
            transform: translate(4px, 4px);
        }

        /* Loader spinner */
        .loader {
            border-top-color: #3498db;
            -webkit-animation: spin 1s linear infinite;
            animation: spin 1s linear infinite;
        }

        @-webkit-keyframes spin {
            0% { -webkit-transform: rotate(0deg); }
            100% { -webkit-transform: rotate(360deg); }
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Full-screen loading overlay */
        .loading-overlay-full {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.7); /* Overlay semi-transparan gelap */
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 100; /* Pastikan di atas semua elemen */
            color: white;
            font-size: 1.5rem;
            font-weight: bold;
            opacity: 0;
            transition: opacity 0.3s ease-in-out;
            pointer-events: none; /* Izinkan klik untuk melewati saat tidak aktif */
        }
        .loading-overlay-full.active {
            opacity: 1;
            pointer-events: auto;
        }

        /* Modal Styles */
        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 101;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.3s ease, visibility 0.3s ease;
        }
        .modal.active {
            opacity: 1;
            visibility: visible;
        }
        .modal-content {
            background-color: white;
            color: black;
            padding: 2rem;
            border-radius: 8px;
            border: 4px solid black;
            box-shadow: 8px 8px 0px black;
            text-align: center;
            max-width: 90%;
            width: 400px;
            transform: translateY(-20px);
            transition: transform 0.3s ease;
            max-height: 90vh; /* Limit height for scrollability */
            overflow-y: auto; /* Enable scrolling for content */
        }
        .modal.active .modal-content {
            transform: translateY(0);
        }
        .modal-content h3 {
            font-size: 1.8rem;
            font-weight: bold;
            margin-bottom: 1rem;
            font-family: 'Comic Neue', cursive;
        }
        .modal-content p {
            margin-bottom: 1.5rem;
            font-size: 1.1rem;
            font-family: 'Inter', sans-serif;
        }
        .modal-buttons {
            display: flex;
            justify-content: center;
            gap: 1rem;
        }

        /* Styling for the artifact output card */
        .artifact-output-card {
            background-color: #e0e0e0; /* Light gray background */
            color: black;
            padding: 20px;
            border-radius: 8px;
            border: 2px solid #000;
            box-shadow: 4px 4px 0px #000;
            margin-top: 20px;
            text-align: left;
        }
        .artifact-output-card h3 {
            font-size: 1.6rem;
            font-weight: bold;
            margin-bottom: 10px;
            font-family: 'Comic Neue', cursive;
            border-bottom: 2px solid #000;
            padding-bottom: 5px;
        }
        .artifact-output-card p {
            font-family: 'Inter', sans-serif;
            font-size: 1rem;
            line-height: 1.6;
            margin-bottom: 10px;
        }
        .artifact-output-card .detail-section {
            margin-top: 15px;
        }
        .artifact-output-card .detail-section strong {
            font-family: 'Comic Neue', cursive;
            font-size: 1.1rem;
        }

        /* Stat Block Styling */
        .stat-block {
            background-color: #f0f0f0;
            border: 2px solid #333;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 20px;
            font-family: 'Share Tech Mono', monospace;
            box-shadow: 2px 2px 0px #333;
        }
        .stat-block h4 {
            font-family: 'Comic Neue', cursive;
            font-size: 1.4rem;
            font-weight: bold;
            margin-bottom: 10px;
            border-bottom: 1px solid #aaa;
            padding-bottom: 5px;
        }
        .stat-block table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }
        .stat-block th, .stat-block td {
            padding: 8px;
            border: 1px solid #ccc;
            text-align: left;
            vertical-align: top;
        }
        .stat-block th {
            background-color: #e0e0e0;
            font-weight: bold;
            width: 30%; /* Adjust as needed */
        }
        .stat-block td {
            background-color: #fff;
        }
        .stat-block ul {
            list-style-type: disc;
            margin-left: 20px;
        }
        .stat-block li {
            margin-bottom: 5px;
        }

        /* Vault Modal Specific Styles */
        #vault-modal .modal-content {
            width: 95%;
            max-width: 800px;
            text-align: left;
        }
        #vault-list {
            max-height: 400px;
            overflow-y: auto;
            border: 1px solid #ccc;
            padding: 10px;
            border-radius: 5px;
            margin-bottom: 15px;
        }
        .vault-item {
            background-color: #f9f9f9;
            border: 1px solid #eee;
            padding: 10px;
            margin-bottom: 8px;
            border-radius: 5px;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 10px;
        }
        .vault-item-name {
            font-weight: bold;
            flex-grow: 1;
            min-width: 150px;
        }
        .vault-item-tags {
            font-style: italic;
            color: #555;
            flex-grow: 1;
            min-width: 100px;
        }
        .vault-item-actions {
            display: flex;
            gap: 5px;
            flex-wrap: wrap;
        }
        .vault-item-actions button {
            padding: 5px 10px;
            font-size: 0.8rem;
            border-radius: 5px;
            border: 1px solid black;
            box-shadow: 2px 2px 0px black;
            transition: all 0.1s ease-in-out;
        }
        .vault-item-actions button:hover {
            box-shadow: 1px 1px 0px black;
            transform: translate(1px, 1px);
        }
        .vault-item-actions .bg-blue-500 { background-color: #3b82f6; color: white; }
        .vault-item-actions .bg-green-500 { background-color: #22c55e; color: white; }
        .vault-item-actions .bg-red-500 { background-color: #ef4444; color: white; }

    </style>
</head>

    <script>
        // API Key will be loaded from localStorage, default is blank.
        let API_KEY = localStorage.getItem('geminiApiKeyArtifact') || ""; 

        const apiKeyInput = document.getElementById('api-key-input');
        const saveApiKeyBtn = document.getElementById('save-api-key-btn');
        const apiKeySection = document.getElementById('api-key-section');
        const mainContent = document.getElementById('main-content'); // Main content container

        const itemTypeSelect = document.getElementById('item-type-select');
        const manualItemTypeInput = document.getElementById('manual-item-type-input');
        const generateEffectBtn = document.getElementById('generate-effect-btn');
        const effectInput = document.getElementById('effect-input');
        const rankSelect = document.getElementById('rank-select');
        const manualRankInput = document.getElementById('manual-rank-input');
        const contextInput = document.getElementById('context-input');
        const generateArtifactBtn = document.getElementById('generate-artifact-btn');
        const copyArtifactBtn = document.getElementById('copy-artifact-btn');
        const clearArtifactBtn = document.getElementById('clear-artifact-btn');
        const artifactImagePromptSection = document.getElementById('artifact-image-prompt-section'); // New section
        const artifactImagePromptText = document.getElementById('artifact-image-prompt-text'); // New text element
        const copyArtifactImagePromptBtn = document.getElementById('copy-artifact-image-prompt-btn'); // New button
        const showVaultBtn = document.getElementById('show-vault-btn'); // New vault button
        
        const buttonText = document.getElementById('button-text');
        const loadingSpinner = document.getElementById('loading-spinner');
        const artifactOutputSection = document.getElementById('artifact-output-section');
        const initialMessage = document.getElementById('initial-message');
        const fullLoadingOverlay = document.getElementById('full-loading-overlay');
        const overlayMessage = document.getElementById('overlay-message');

        // Custom Modal elements
        const customModal = document.getElementById('custom-modal');
        const modalTitle = document.getElementById('modal-title');
        const modalMessage = document.getElementById('modal-message');
        const modalConfirmBtn = document.getElementById('modal-confirm-btn');
        const modalCancelBtn = document.getElementById('modal-cancel-btn');

        // Vault Modal elements
        const vaultModal = document.getElementById('vault-modal');
        const closeVaultBtn = document.getElementById('close-vault-btn');
        const vaultList = document.getElementById('vault-list');
        const vaultSearchInput = document.getElementById('vault-search-input');
        const vaultTagInput = document.getElementById('vault-tag-input');
        const exportAllJsonBtn = document.getElementById('export-all-json-btn');

        const loadingMessages = [
            "Memahat detail artefak...",
            "Menuliskan kisah legendaris...",
            "Menggali kekuatan tersembunyi...",
            "Menciptakan objek unik...",
            "Menyelaraskan kutukan dan berkah..."
        ];

        // --- Custom Modal Functions (replaces alert/confirm) ---
        function showModal(title, message, type = 'alert') {
            return new Promise((resolve) => {
                modalTitle.textContent = title;
                modalMessage.textContent = message;
                customModal.classList.add('active');

                modalConfirmBtn.classList.remove('hidden');
                modalConfirmBtn.onclick = () => {
                    customModal.classList.remove('active');
                    resolve(true);
                };

                if (type === 'confirm') {
                    modalCancelBtn.classList.remove('hidden');
                    modalCancelBtn.onclick = () => {
                        customModal.classList.remove('active');
                        resolve(false);
                    };
                } else {
                    modalCancelBtn.classList.add('hidden');
                }
            });
        }

        // --- API Key Handling ---
        async function validateAndLoadApiKey(key) {
            if (!key) {
                await showModal('Peringatan!', 'API Key tidak boleh kosong.');
                return false;
            }

            console.log("DEBUG: Validating API Key:", key.substring(0, 5) + "...");
            // Perform a small, quick test call to validate the API key
            try {
                let chatHistory = [{ role: "user", parts: [{ text: "Hello" }] }]; // Minimal prompt
                const payload = { contents: chatHistory };
                const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=${key}`;

                const response = await fetch(apiUrl, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                if (!response.ok) {
                    const errorBody = await response.json(); // Attempt to parse JSON error
                    const errorMessage = errorBody.error ? errorBody.error.message : 'Unknown error';
                    await showModal('Validasi Gagal!', `API Key tidak valid: ${errorMessage}.`);
                    console.error("API Key validation failed:", response.status, errorBody);
                    return false;
                }
                const result = await response.json();
                if (!result.candidates || result.candidates.length === 0) {
                     await showModal('Validasi Gagal!', 'API Key valid namun respons tidak sesuai. Coba lagi atau periksa key Anda.');

        // Function to copy text to clipboard
        async function copyToClipboard(text, alertMessage = 'Deskripsi berhasil disalin ke clipboard!') {
            const textarea = document.createElement('textarea');
            textarea.value = text;
            textarea.style.position = 'fixed';
            textarea.style.top = 0;
            textarea.style.left = 0;
            textarea.style.width = '1px';
            textarea.style.height = '1px';
            textarea.style.opacity = 0;
            document.body.appendChild(textarea);
            textarea.focus();
            textarea.select();
            try {
                document.execCommand('copy');
                await showModal('Berhasil!', alertMessage);
            } catch (err) {
                console.error('Gagal menyalin teks: ', err);
                await showModal('Gagal!', 'Gagal menyalin. Silakan salin manual.');
            } finally {
                document.body.removeChild(textarea);
            }
        }

        // Function to get raw text for copying
        function getRawArtifactContent(artifactData) {
            let rawText = '';
            // Add Stat Block to raw text
            if (artifactData.statBlock) {
                rawText += `--- STAT BLOCK ---\n`;
                rawText += `Nama: ${artifactData.statBlock.name || 'N/A'}\n`;
                rawText += `Jenis / Rarity: ${artifactData.statBlock.typeRarity || 'N/A'}\n`;
                rawText += `Berat: ${artifactData.statBlock.weight || 'N/A'}\n`;
                if (artifactData.statBlock.value) rawText += `Nilai: ${artifactData.statBlock.value}\n`;
                if (artifactData.statBlock.stats && artifactData.statBlock.stats.length > 0) {
                    artifactData.statBlock.stats.forEach(s => {
                        rawText += `${s.label}: ${s.description}\n`;
                    });
                }
                rawText += `-------------------\n\n`;
            }

            // Use combined name for copying
            rawText += `Nama Item: ${artifactData.itemNameEnglish} (${artifactData.itemNameIndonesian})\n\n`;
            if (artifactData.rank) rawText += `Rank: ${artifactData.rank}\n\n`;
            if (artifactData.physicalDescription) rawText += `Penampilan Fisik: ${artifactData.physicalDescription}\n\n`;
            if (artifactData.originStory) rawText += `Kisah Asal-Usul: ${artifactData.originStory}\n\n`;
            if (artifactData.powersCursesEffects) rawText += `Kekuatan/Kutukan/Efek: ${artifactData.powersCursesEffects}\n\n`;
            if (artifactData.weaknesses) rawText += `Kelemahan/Keterbatasan: ${artifactData.weaknesses}\n\n`;
            if (artifactData.storyImplications) rawText += `Implikasi dalam Cerita: ${artifactData.storyImplications}\n\n`;
            if (artifactData.imagePrompt) rawText += `Prompt Gambar AI: ${artifactData.imagePrompt}\n\n`; // Add image prompt to raw text
            return rawText.trim();
        }

                     try {
                        const errorMessage = errorBody.error ? errorBody.error.message : 'Unknown error';
                        await showModal('Kesalahan API!', `API Error (${response.status}): ${errorMessage}. Pastikan API Key valid.`);
                    } catch (parseError) {
                        await showModal('Kesalahan API!', `API Error (${response.status}): ${response.statusText}. Response: ${JSON.stringify(errorBody).substring(0, 100)}...`);
                    }
                    throw new Error(`API response was not ok: ${response.status} ${response.statusText} - ${JSON.stringify(errorBody)}`);
                }

                const result = await response.json();
                console.log("DEBUG: Random Effect Raw Result:", result);

                if (result.candidates && result.candidates.length > 0 && result.candidates[0].content && result.candidates[0].content.parts && result.candidates[0].content.parts.length > 0) {
                    const generatedEffect = result.candidates[0].content.parts[0].text.trim().replace(/"/g, '');
                    console.log("DEBUG: Generated Random Effect:", generatedEffect);
                    effectInput.value = generatedEffect;
                } else {
                    console.error('AI failed to generate effect (missing candidates/content). Result:', result);
                    await showModal('Gagal!', 'AI tidak dapat menghasilkan efek. Coba lagi.');
                }
            } catch (error) {
                console.error("ERROR in generateRandomEffect:", error);
                if (!document.getElementById('custom-modal').classList.contains('active')) {
                    await showModal('Kesalahan!', `Terjadi kesalahan saat mengacak efek: ${error.message}.`);
                }
            } finally {
                generateEffectBtn.disabled = false;
                generateEffectBtn.textContent = "Acak Efek";
            }
        }

        // --- My Vault Functions ---
        function getArtifactsFromVault() {
            try {
                const artifactsJson = localStorage.getItem('myArtifactsVault');
                return artifactsJson ? JSON.parse(artifactsJson) : [];
            } catch (e) {
                console.error("Error parsing artifacts from localStorage:", e);
                return [];
            }
        }

        function saveArtifactsToVault(artifacts) {
            localStorage.setItem('myArtifactsVault', JSON.stringify(artifacts));
        }

        function saveArtifactToVault(artifactData) {
            const artifacts = getArtifactsFromVault();
            // Assign a unique ID and timestamp
            artifactData.id = Date.now().toString() + Math.random().toString(36).substring(2, 9);
            artifactData.timestamp = new Date().toISOString();
            artifactData.tags = []; // Initialize with empty tags
            artifacts.unshift(artifactData); // Add to the beginning
            saveArtifactsToVault(artifacts);
            console.log("Artifact saved to vault:", artifactData);
            showModal('Berhasil!', `Artefak "${artifactData.itemNameIndonesian}" telah disimpan ke My Vault!`);
        }

        function renderVaultList(filterName = '', filterTags = []) {
            const artifacts = getArtifactsFromVault();
            vaultList.innerHTML = ''; // Clear current list

            if (artifacts.length === 0) {
                vaultList.innerHTML = '<p class="text-center text-gray-600 default-font">Vault Anda kosong.</p>';
                return;
            }

            const filteredArtifacts = artifacts.filter(artifact => {
                const matchesName = artifact.itemNameIndonesian.toLowerCase().includes(filterName.toLowerCase()) ||
                                    artifact.itemNameEnglish.toLowerCase().includes(filterName.toLowerCase());
                
                const artifactTags = artifact.tags ? artifact.tags.map(tag => tag.toLowerCase()) : [];
                const matchesTags = filterTags.length === 0 || filterTags.every(tag => artifactTags.includes(tag.toLowerCase()));
                
                return matchesName && matchesTags;
            });

            if (filteredArtifacts.length === 0) {
                vaultList.innerHTML = '<p class="text-center text-gray-600 default-font">Tidak ada artefak yang cocok dengan filter Anda.</p>';
                return;
            }

            filteredArtifacts.forEach(artifact => {
                const vaultItemDiv = document.createElement('div');
                vaultItemDiv.className = 'vault-item';
                vaultItemDiv.innerHTML = `
                    <span class="vault-item-name">${artifact.itemNameIndonesian}</span>
                    <span class="vault-item-tags" id="tags-${artifact.id}">${artifact.tags.join(', ') || 'Tidak ada tag'}</span>
                    <input type="text" id="tag-input-${artifact.id}" placeholder="Tambah tag (koma)" class="p-1 border border-gray-300 rounded-md text-xs default-font text-black flex-grow min-w-[100px]">
                    <div class="vault-item-actions">
                        <button class="view-artifact-btn bg-blue-500 text-white" data-id="${artifact.id}">Lihat</button>
                        <button class="edit-tags-btn bg-green-500 text-white" data-id="${artifact.id}">Simpan Tag</button>
                        <button class="export-json-btn bg-gray-500 text-white" data-id="${artifact.id}">JSON</button>
                        <button class="export-pdf-btn bg-gray-500 text-white" data-id="${artifact.id}">PDF</button>
                        <button class="delete-artifact-btn bg-red-500 text-white" data-id="${artifact.id}">Hapus</button>
                    </div>
                `;
                vaultList.appendChild(vaultItemDiv);
            });

            // Add event listeners to newly created buttons
            vaultList.querySelectorAll('.view-artifact-btn').forEach(btn => {
                btn.addEventListener('click', (e) => viewArtifactFromVault(e.target.dataset.id));
            });
            vaultList.querySelectorAll('.edit-tags-btn').forEach(btn => {
                btn.addEventListener('click', (e) => saveTagsForArtifact(e.target.dataset.id));
            });
            vaultList.querySelectorAll('.export-json-btn').forEach(btn => {
                btn.addEventListener('click', (e) => exportArtifactToJson(e.target.dataset.id));
            });
            vaultList.querySelectorAll('.export-pdf-btn').forEach(btn => {
                btn.addEventListener('click', (e) => exportArtifactToPdf(e.target.dataset.id));
            });
            vaultList.querySelectorAll('.delete-artifact-btn').forEach(btn => {
                btn.addEventListener('click', (e) => deleteArtifactFromVault(e.target.dataset.id));
            });
        }

        function viewArtifactFromVault(id) {
            const artifacts = getArtifactsFromVault();
            const artifact = artifacts.find(a => a.id === id);
            if (artifact) {
                renderArtifact(artifact);
                artifactOutputSection.currentArtifactData = artifact; // Set current data for copy button
                vaultModal.classList.remove('active'); // Close vault modal
            } else {
                showModal('Kesalahan!', 'Artefak tidak ditemukan.');
            }
        }

        async function saveTagsForArtifact(id) {
            const tagInput = document.getElementById(`tag-input-${id}`);
            const tagsSpan = document.getElementById(`tags-${id}`);
            if (!tagInput || !tagsSpan) return;

            let newTags = tagInput.value.split(',').map(tag => tag.trim()).filter(tag => tag !== '');
            
            const artifacts = getArtifactsFromVault();
            const artifactIndex = artifacts.findIndex(a => a.id === id);

            if (artifactIndex !== -1) {
                artifacts[artifactIndex].tags = newTags;
                saveArtifactsToVault(artifacts);
                tagsSpan.textContent = newTags.join(', ') || 'Tidak ada tag';
                tagInput.value = ''; // Clear input after saving
                await showModal('Berhasil!', 'Tag berhasil diperbarui!');
            } else {
                await showModal('Kesalahan!', 'Artefak tidak ditemukan.');
            }
        }

        async function deleteArtifactFromVault(id) {
            const confirmed = await showModal('Konfirmasi', 'Anda yakin ingin menghapus artefak ini dari vault?', 'confirm');
            if (!confirmed) return;

            let artifacts = getArtifactsFromVault();
            const initialLength = artifacts.length;
            artifacts = artifacts.filter(a => a.id !== id);
            if (artifacts.length < initialLength) {
                saveArtifactsToVault(artifacts);
                renderVaultList(vaultSearchInput.value, vaultTagInput.value.split(',').map(t => t.trim()).filter(t => t !== '')); // Re-render with current filters
                await showModal('Berhasil!', 'Artefak berhasil dihapus.');
            } else {
                await showModal('Kesalahan!', 'Artefak tidak ditemukan.');
            }
        }

        function exportArtifactToJson(id) {
            const artifacts = getArtifactsFromVault();
            const artifact = artifacts.find(a => a.id === id);
            if (artifact) {
                const filename = `${artifact.itemNameEnglish.replace(/[^a-zA-Z0-9]/g, '_')}.json`;
                const jsonStr = JSON.stringify(artifact, null, 2);
                const blob = new Blob([jsonStr], { type: 'application/json' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = filename;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
                showModal('Berhasil!', 'Artefak berhasil diekspor sebagai JSON.');
            } else {
                showModal('Kesalahan!', 'Artefak tidak ditemukan.');
            }
        }

        async function exportArtifactToPdf(id) {
            const artifacts = getArtifactsFromVault();
            const artifact = artifacts.find(a => a.id === id);
            if (!artifact) {
                await showModal('Kesalahan!', 'Artefak tidak ditemukan.');
                return;
            }

            // Temporarily render the artifact to a hidden div to capture its HTML
            const tempDiv = document.createElement('div');
            tempDiv.style.position = 'absolute';
            tempDiv.style.left = '-9999px';
            tempDiv.style.width = '794px'; // A4 width in pixels at 96 DPI
            tempDiv.style.padding = '20px';
            tempDiv.style.backgroundColor = 'white';
            tempDiv.style.color = 'black';
            tempDiv.style.fontFamily = 'Inter, sans-serif';
            tempDiv.style.fontSize = '12px';
            document.body.appendChild(tempDiv);

            // Use renderArtifact to populate the tempDiv
            const originalOutput = artifactOutputSection.innerHTML; // Save original content
            const originalCurrentArtifactData = artifactOutputSection.currentArtifactData;

            renderArtifact(artifact); // Render to the visible section first to get the HTML
            tempDiv.innerHTML = artifactOutputSection.innerHTML; // Copy the rendered HTML

            // Restore original content
            artifactOutputSection.innerHTML = originalOutput;
            artifactOutputSection.currentArtifactData = originalCurrentArtifactData;


            await showModal('Membuat PDF...', 'Harap tunggu, PDF sedang dibuat.');
            try {
                const canvas = await html2canvas(tempDiv, {
                    scale: 2, // Increase scale for better resolution
                    useCORS: true, // If you have external images (though we avoid them)
                    logging: false // Disable logging for cleaner console
                });

                const imgData = canvas.toDataURL('image/png');
                const pdf = new window.jspdf.jsPDF('p', 'mm', 'a4'); // 'p' for portrait, 'mm' for millimeters, 'a4' size
                const imgWidth = 210; // A4 width in mm
                const pageHeight = 297; // A4 height in mm
                const imgHeight = canvas.height * imgWidth / canvas.width;
                let heightLeft = imgHeight;
                let position = 0;

                pdf.addImage(imgData, 'PNG', 0, position, imgWidth, imgHeight);
                heightLeft -= pageHeight;

                while (heightLeft >= 0) {
                    position = heightLeft - imgHeight;
                    pdf.addPage();
                    pdf.addImage(imgData, 'PNG', 0, position, imgWidth, imgHeight);
                    heightLeft -= pageHeight;
                }

                const filename = `${artifact.itemNameEnglish.replace(/[^a-zA-Z0-9]/g, '_')}.pdf`;
                pdf.save(filename);
                showModal('Berhasil!', 'Artefak berhasil diekspor sebagai PDF.');
            } catch (error) {
                console.error("Error generating PDF:", error);
                showModal('Gagal!', `Gagal membuat PDF: ${error.message}.`);
            } finally {
                document.body.removeChild(tempDiv);
            }
        }

        function exportAllArtifactsToJson() {
            const artifacts = getArtifactsFromVault();
            if (artifacts.length === 0) {
                showModal('Peringatan!', 'Vault Anda kosong, tidak ada yang bisa diekspor.');
                return;
            }
            const filename = `my_artifacts_vault_${Date.now()}.json`;
            const jsonStr = JSON.stringify(artifacts, null, 2);
            const blob = new Blob([jsonStr], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = filename;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
            showModal('Berhasil!', 'Semua artefak berhasil diekspor sebagai JSON.');
        }

        // --- Event Listeners ---
        generateArtifactBtn.addEventListener('click', generateArtifact);
        generateEffectBtn.addEventListener('click', generateRandomEffect);

        copyArtifactBtn.addEventListener('click', async () => {
            if (artifactOutputSection.currentArtifactData) {
                const rawText = getRawArtifactContent(artifactOutputSection.currentArtifactData);
                await copyToClipboard(rawText);
            } else {
                await showModal('Peringatan!', 'Tidak ada artefak untuk disalin.');
            }
        });

        copyArtifactImagePromptBtn.addEventListener('click', async () => {
            const promptToCopy = artifactImagePromptText.textContent;
            if (promptToCopy) {
                await copyToClipboard(promptToCopy, 'Prompt gambar AI artefak berhasil disalin ke clipboard!');
            } else {
                await showModal('Peringatan!', 'Tidak ada prompt gambar artefak untuk disalin.');
            }
        });

        clearArtifactBtn.addEventListener('click', async () => {
            const confirmed = await showModal('Konfirmasi', 'Anda yakin ingin menghapus deskripsi artefak yang sedang ditampilkan dan input?', 'confirm');
            if (confirmed) {
                itemTypeSelect.value = 'Lainnya'; // Reset to default
                manualItemTypeInput.value = ''; // Clear manual input
                manualItemTypeInput.classList.remove('hidden'); // Ensure visible for default
                effectInput.value = '';
                rankSelect.value = 'F'; // Reset rank
                manualRankInput.value = ''; // Clear manual rank
                manualRankInput.classList.add('hidden'); // Hide manual rank input
                contextInput.value = '';
                artifactOutputSection.innerHTML = `
                    <p class="text-center text-gray-600 default-font text-lg pt-20" id="initial-message">
                        Pilih jenis item dan efek, lalu klik "Rancang Artefak!"
                    </p>
                `;
                initialMessage.classList.remove('hidden');
                copyArtifactBtn.classList.add('hidden');
                clearArtifactBtn.classList.add('hidden');
                artifactOutputSection.currentArtifactData = null; // Clear stored data
                artifactImagePromptSection.classList.add('hidden'); // Hide image prompt section
                artifactImagePromptText.textContent = ''; // Clear image prompt text
                copyArtifactImagePromptBtn.classList.add('hidden'); // Hide copy button
            }
        });

        // Vault button listeners
        showVaultBtn.addEventListener('click', () => {
            vaultModal.classList.add('active');
            renderVaultList(vaultSearchInput.value, vaultTagInput.value.split(',').map(t => t.trim()).filter(t => t !== '')); // Render with current filters
        });

        closeVaultBtn.addEventListener('click', () => {
            vaultModal.classList.remove('active');
        });

        vaultSearchInput.addEventListener('input', () => {
            const tags = vaultTagInput.value.split(',').map(t => t.trim()).filter(t => t !== '');
            renderVaultList(vaultSearchInput.value, tags);
        });

        vaultTagInput.addEventListener('input', () => {
            const tags = vaultTagInput.value.split(',').map(t => t.trim()).filter(t => t !== '');
            renderVaultList(vaultSearchInput.value, tags);
        });

        exportAllJsonBtn.addEventListener('click', exportAllArtifactsToJson);

        // Initial setup on page load
        window.onload = () => {
            loadAndDisplayApiKey();
            // Set initial state for item type: "Lainnya" selected and manual input visible
            // This is done after loadApiKey to ensure visibility logic is correct.
            itemTypeSelect.value = 'Lainnya';
            manualItemTypeInput.classList.remove('hidden');
        };
    </script>
</body>
