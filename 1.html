<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tasbih Digital</title>
    <style>
        /* Menggunakan Tailwind CSS untuk styling dasar */
        @import url('https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css');
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap');

        /* Styling kustom untuk overrides dan animasi */
        body {
            font-family: 'Inter', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            min-height: 100vh;
            background-color: #f0f2f5;
            color: #333;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
            overflow-y: auto; /* Memungkinkan gulir vertikal */
        }

        /* Container utama untuk tasbih, berfungsi sebagai "card" */
        .container {
            background-color: #ffffff;
            padding: 30px 40px;
            border-radius: 15px;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.15); /* Bayangan lebih kuat */
            text-align: center;
            width: 100%;
            max-width: 500px;
            margin-bottom: 30px;
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Judul aplikasi */
        h1 {
            color: #2c3e50;
            margin-bottom: 25px;
            font-size: 2.2em;
        }

        /* Gaya untuk tombol-tombol pilihan bacaan */
        .options {
            margin-bottom: 30px;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px;
            width: 100%;
        }

        .options button {
            background-color: #3498db;
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 8px;
            font-size: 1.1em;
            cursor: pointer;
            transition: background-color 0.3s ease, transform 0.1s ease;
            flex-grow: 1;
            min-width: 120px;
            max-width: 100%; 
        }

        .options button:hover {
            background-color: #2980b9;
            transform: translateY(-2px);
        }

        /* Gaya untuk tombol pilihan yang sedang aktif/terpilih */
        .options button.selected {
            background-color: #27ae60;
            box-shadow: 0 0 0 3px #27ae60, 0 0 0 6px rgba(39, 174, 96, 0.5);
            transform: scale(1.05);
        }

        /* Area tampilan bacaan di tengah (untuk teks acak) */
        .reading-display-area {
            position: relative;
            height: 150px; /* Tinggi yang cukup untuk tampilan bacaan */
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 20px;
            overflow: hidden; /* Pastikan teks tidak keluar dari area */
        }

        /* Gaya untuk teks bacaan yang muncul secara dinamis */
        .floating-reading-text {
            position: absolute;
            font-size: 2.5em;
            font-weight: bold;
            color: #e74c3c;
            opacity: 0; /* Dimulai dengan tidak terlihat, akan diatur 1 oleh JS */
            pointer-events: none; /* Agar tidak mengganggu interaksi lain */
            white-space: nowrap; /* Mencegah teks melipat */
            animation: floatAndFadeOut 1.5s forwards; /* Animasi baru */
        }

        /* Keyframe untuk animasi float dan fade out */
        @keyframes floatAndFadeOut {
            0% { opacity: 0; transform: translateY(10px) scale(0.8); }
            10% { opacity: 1; transform: translateY(0) scale(1); } /* Cepat muncul dan membesar */
            90% { opacity: 1; transform: translateY(0) scale(1); } /* Tetap terlihat */
            100% { opacity: 0; transform: translateY(-10px) scale(1.2); } /* Fade out dan sedikit membesar */
        }

        /* Gaya untuk peringatan fokus */
        #focus-warning {
            color: #e74c3c;
            font-weight: bold;
            margin-top: 15px;
            font-size: 1.2em;
            opacity: 0;
            transition: opacity 0.5s ease-out;
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 100%;
            text-align: center;
        }

        /* Kontrol bawah: hitungan di kiri, tombol klik di kanan */
        .bottom-controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            margin-top: 20px;
        }

        /* Gaya untuk tampilan hitungan saat ini (di sisi kiri) */
        #current-count {
            font-size: 4.5em;
            font-weight: bold;
            color: #2c3e50;
            flex-shrink: 0;
            margin-right: 20px;
        }

        /* Gaya untuk tombol utama "Klik" (di sisi kanan) */
        #click-button {
            background-color: #e67e22;
            color: white;
            border: none;
            padding: 20px 40px;
            border-radius: 50%;
            font-size: 1.8em;
            cursor: pointer;
            transition: background-color 0.3s ease, transform 0.1s ease;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
            width: 150px;
            height: 150px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        #click-button:hover {
            background-color: #d35400;
            transform: translateY(-3px);
        }

        /* Gaya untuk tombol "Berhenti" */
        #stop-button {
            background-color: #c0392b;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            font-size: 1em;
            cursor: pointer;
            transition: background-color 0.3s ease;
            margin-top: 15px;
            display: none;
        }

        #stop-button:hover {
            background-color: #a02c21;
        }

        /* Bagian riwayat, juga berfungsi sebagai "card" */
        .history-section {
            background-color: #ffffff;
            padding: 25px 35px;
            border-radius: 15px;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.15); /* Bayangan lebih kuat */
            width: 100%;
            max-width: 700px;
            margin-top: 30px;
        }

        .history-section h2 {
            color: #2c3e50;
            margin-bottom: 20px;
            font-size: 1.8em;
            text-align: center;
        }

        /* Gaya tabel riwayat */
        #history-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }

        #history-table th, #history-table td {
            border: 1px solid #ddd;
            padding: 12px;
            text-align: left;
        }

        #history-table th {
            background-color: #f2f2f2;
            color: #555;
            font-weight: bold;
        }

        #history-table tbody tr:nth-child(even) {
            background-color: #f9f9f9;
        }

        #history-table tbody tr:hover {
            background-color: #f1f1f1;
        }

        /* Gaya tombol hapus di riwayat */
        .delete-button {
            background-color: #e74c3c;
            color: white;
            border: none;
            padding: 6px 10px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 0.85em;
            transition: background-color 0.2s ease;
        }

        .delete-button:hover {
            background-color: #c0392b;
        }

        /* Media queries untuk responsivitas di perangkat mobile */
        @media (max-width: 600px) {
            body {
                padding: 10px;
            }
            .container, .history-section {
                padding: 20px;
            }

            h1 {
                font-size: 1.8em;
            }

            .options button {
                font-size: 1em;
                padding: 10px 15px;
            }

            #current-count {
                font-size: 3.5em;
            }

            .floating-reading-text {
                font-size: 2em;
            }

            .bottom-controls {
                flex-direction: column; /* Tumpuk hitungan dan tombol secara vertikal */
                gap: 20px;
            }

            #click-button {
                width: 120px;
                height: 120px;
                font-size: 1.5em;
                margin-right: 0;
            }

            #current-count {
                margin-right: 0;
            }

            #history-table th, #history-table td {
                padding: 8px;
                font-size: 0.9em;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Tasbih Digital</h1>

        <div class="options">
            <button id="btn-astaghfirullah" data-reading="Astaghfirullah">Astaghfirullah</button>
            <button id="btn-alhamdulillah" data-reading="Alhamdulillah">Alhamdulillah</button>
            <button id="btn-subhanallah" data-reading="Subhanallah">Subhanallah</button>
            <button id="btn-allahuakbar" data-reading="Allahuakbar">Allahuakbar</button>
            <button id="btn-custom" data-reading="Custom">.....</button>
        </div>

        <div class="reading-display-area">
            <!-- Teks bacaan akan muncul di sini secara dinamis -->
            <div id="focus-warning">Ayo fokus!</div>
        </div>
        
        <div class="bottom-controls">
            <div id="current-count">0</div>
            <button id="click-button">Klik</button>
        </div>
        
        <button id="stop-button">Berhenti</button>
    </div>

    <div class="history-section">
        <h2>Riwayat Tasbih</h2>
        <table id="history-table">
            <thead>
                <tr>
                    <th>Bacaan</th>
                    <th>Jumlah Klik</th>
                    <th>Waktu Selesai</th>
                    <th>Aksi</th>
                </tr>
            </thead>
            <tbody>
                <!-- Riwayat akan ditambahkan di sini oleh JavaScript -->
            </tbody>
        </table>
    </div>

    <script>
        // Mendapatkan referensi elemen-elemen HTML
        const countDisplay = document.getElementById('current-count');
        const clickButton = document.getElementById('click-button');
        const stopButton = document.getElementById('stop-button');
        const historyTableBody = document.querySelector('#history-table tbody');
        const focusWarning = document.getElementById('focus-warning');
        const optionButtons = document.querySelectorAll('.options button');
        const readingDisplayArea = document.querySelector('.reading-display-area'); // Area untuk teks bacaan dinamis

        // Variabel-variabel state aplikasi
        let currentCount = 0; // Hitungan klik saat ini
        let selectedReading = ''; // Bacaan yang sedang dipilih
        let hasLimit = false; // Menandakan apakah bacaan memiliki batas 33 klik
        let activityTimeout; // Timeout untuk mendeteksi inaktivitas (peringatan fokus)

        // Konstanta untuk batas dan durasi
        const LIMIT = 33; // Batas maksimal klik untuk bacaan tertentu
        const WARNING_TIMEOUT = 15000; // 15 detik untuk peringatan fokus
        const READING_DISPLAY_DURATION = 1500; // 1.5 detik durasi tampilan bacaan

        /**
         * Mengatur ulang timer aktivitas. Ini dipanggil setiap kali ada interaksi pengguna
         * untuk mencegah peringatan "Ayo fokus!" muncul.
         */
        function resetActivityTimeout() {
            clearTimeout(activityTimeout); // Hapus timer sebelumnya
            focusWarning.style.opacity = 0; // Sembunyikan peringatan jika sudah ada
            activityTimeout = setTimeout(() => {
                showFocusWarning(); // Tampilkan peringatan jika tidak ada aktivitas
            }, WARNING_TIMEOUT);
        }

        /**
         * Menampilkan peringatan "Ayo fokus!" dan menyembunyikannya setelah beberapa detik.
         */
        function showFocusWarning() {
            focusWarning.style.opacity = 1; // Tampilkan peringatan
            setTimeout(() => {
                focusWarning.style.opacity = 0; // Sembunyikan setelah 3 detik
            }, 3000);
        }

        /**
         * Menambahkan entri ke tabel riwayat.
         * @param {string} reading - Bacaan yang dilakukan.
         * @param {number} count - Jumlah klik untuk bacaan tersebut.
         */
        function addHistory(reading, count) {
            const row = historyTableBody.insertRow(0); // Tambah baris baru di paling atas tabel
            const readingCell = row.insertCell(0);
            const countCell = row.insertCell(1);
            const timeCell = row.insertCell(2);
            const actionCell = row.insertCell(3); // Sel untuk tombol hapus

            readingCell.textContent = reading;
            countCell.textContent = count;
            timeCell.textContent = new Date().toLocaleString('id-ID', {
                year: 'numeric', month: 'numeric', day: 'numeric',
                hour: '2-digit', minute: '2-digit', second: '2-digit'
            }); // Format waktu sesuai lokal Indonesia

            // Buat tombol hapus
            const deleteButton = document.createElement('button');
            deleteButton.textContent = 'Hapus';
            deleteButton.classList.add('delete-button');
            deleteButton.addEventListener('click', () => {
                row.remove(); // Hapus baris saat tombol diklik
            });
            actionCell.appendChild(deleteButton);
        }

        /**
         * Mengatur ulang semua state tasbih ke kondisi awal.
         */
        function resetTasbih() {
            currentCount = 0; // Reset hitungan
            countDisplay.textContent = currentCount; // Perbarui tampilan hitungan
            
            // Hapus semua teks bacaan yang sedang muncul
            readingDisplayArea.querySelectorAll('.floating-reading-text').forEach(el => el.remove());

            stopButton.style.display = 'none'; // Sembunyikan tombol berhenti
            
            // Hapus kelas 'selected' dari semua tombol pilihan
            optionButtons.forEach(btn => btn.classList.remove('selected'));
            
            selectedReading = ''; // Reset pilihan bacaan
            hasLimit = false; // Reset status batas
            resetActivityTimeout(); // Reset timer aktivitas
        }

        // Menambahkan event listener ke setiap tombol pilihan bacaan
        optionButtons.forEach(button => {
            button.addEventListener('click', () => {
                // Jika pilihan yang sama diklik lagi, abaikan
                if (selectedReading === button.dataset.reading) {
                    return;
                }

                // Jika ada sesi yang sedang berjalan (currentCount > 0) dan bacaan sebelumnya dipilih,
                // simpan ke riwayat sebelum mengganti bacaan baru.
                if (selectedReading && currentCount > 0) {
                    addHistory(selectedReading, currentCount);
                }
                
                // Atur ulang tampilan dan state untuk sesi baru
                resetTasbih();

                // Set bacaan yang baru dipilih
                selectedReading = button.dataset.reading;
                // Tambahkan kelas 'selected' ke tombol yang baru diklik
                button.classList.add('selected');

                // Tentukan apakah bacaan memiliki batas atau tidak
                if (selectedReading === 'Alhamdulillah' || selectedReading === 'Subhanallah' || selectedReading === 'Allahuakbar') {
                    hasLimit = true;
                    stopButton.style.display = 'none'; // Sembunyikan tombol berhenti jika ada batas
                } else {
                    hasLimit = false;
                    stopButton.style.display = 'inline-block'; // Tampilkan tombol berhenti untuk bacaan tanpa batas
                }
                resetActivityTimeout(); // Reset timer aktivitas setelah memilih bacaan baru
            });
        });

        // Menambahkan event listener ke tombol "Klik"
        clickButton.addEventListener('click', () => {
            // Jika belum ada bacaan yang dipilih, tampilkan peringatan
            if (!selectedReading) {
                alert('Silakan pilih bacaan terlebih dahulu!');
                return;
            }

            currentCount++; // Tambah hitungan
            countDisplay.textContent = currentCount; // Perbarui tampilan hitungan

            // Buat elemen div baru untuk teks bacaan yang mengambang
            const newReadingText = document.createElement('div');
            newReadingText.textContent = selectedReading;
            newReadingText.classList.add('floating-reading-text'); // Terapkan gaya dan animasi

            // Tambahkan sementara ke DOM untuk mendapatkan dimensinya
            readingDisplayArea.appendChild(newReadingText);

            // Hitung posisi acak dalam area tampilan
            const areaRect = readingDisplayArea.getBoundingClientRect();
            const textRect = newReadingText.getBoundingClientRect();

            // Pastikan teks tetap di dalam batas area
            // Random X and Y positions within the area, accounting for text size
            const randomX = Math.random() * (areaRect.width - textRect.width);
            const randomY = Math.random() * (areaRect.height - textRect.height);

            newReadingText.style.left = `${randomX}px`;
            newReadingText.style.top = `${randomY}px`;
            
            // Set opacity ke 1 untuk memicu animasi fade-in (dari CSS @keyframes)
            newReadingText.style.opacity = 1;

            // Hapus elemen setelah durasi animasi selesai
            setTimeout(() => {
                newReadingText.remove();
            }, READING_DISPLAY_DURATION);

            // Cek batas klik jika bacaan memiliki batas
            if (hasLimit && currentCount >= LIMIT) {
                addHistory(selectedReading, currentCount); // Tambahkan ke riwayat
                resetTasbih(); // Reset tasbih
                alert(`Sesi ${selectedReading} telah selesai (${LIMIT} kali).`); // Beri tahu pengguna
            }
            resetActivityTimeout(); // Reset timer aktivitas setelah setiap klik
        });

        // Menambahkan event listener ke tombol "Berhenti"
        stopButton.addEventListener('click', () => {
            // Jika ada sesi yang sedang berjalan dan hitungan lebih dari 0, simpan ke riwayat
            if (selectedReading && currentCount > 0) {
                addHistory(selectedReading, currentCount);
            }
            resetTasbih(); // Reset tasbih
            alert('Sesi telah dihentikan.'); // Beri tahu pengguna
        });

        // Inisialisasi: Mulai timer aktivitas saat halaman dimuat
        resetActivityTimeout();
    </script>
</body>
</html>
